<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Whatnot Mana Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 14px;
    }
    .orb {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #a855f7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #4f46e5);
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .footer {
      text-align: center;
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="orb">🔮</div>
    <div>
      <div class="title">Mana Sync Extension</div>
      <div class="subtitle">Whatnot OBS Leaderboard</div>
    </div>
  </div>

  <div class="status-card">
    <span style="font-size: 12px; color: #94a3b8;">Relay Server:</span>
    <div class="status-badge">
      <span id="status-dot" class="dot"></span>
      <span id="status-text" style="color: #f43f5e;">Verbinde...</span>
    </div>
  </div>

  <button id="btn-test-purchase" class="btn btn-primary">
    ⚡ Test-Kauf simulieren
  </button>

  <button id="btn-open-admin" class="btn btn-secondary">
    🎛️ Streamer Deck öffnen
  </button>

  <button id="btn-open-overlay" class="btn btn-secondary">
    ✨ OBS Overlay ansehen
  </button>

  <div class="footer">
    Läuft automatisch im Whatnot Seller Dashboard.
  </div>

  <script src="popup.js"></script>
</body>
</html>
